name: Build APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Copy index.html to Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          echo "index.html size: $(wc -c < android/app/src/main/assets/index.html) bytes"

      - name: Setup Gradle 8.2.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.2'
          cache-disabled: true

      - name: Build debug APK
        working-directory: android
        run: |
          echo "=== Gradle version ==="
          gradle --version
          echo "=== Build ==="
          gradle assembleDebug --no-build-cache --rerun-tasks --info 2>&1 | tail -200
          echo "=== APK files ==="
          find . -name "*.apk" -exec ls -lh {} \;

      - name: Verify APK size
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            find android -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          SIZE=$(wc -c < "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 500000 ]; then
            echo "ERROR: APK too small ($SIZE bytes), build failed silently"
            exit 1
          fi
          echo "APK size OK: $SIZE bytes"

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/crois-en-moi.apk
          echo "Final size: $(wc -c < android/app/build/outputs/apk/debug/crois-en-moi.apk) bytes"

      - name: Create or update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          removeArtifacts: true
          tag: latest
          name: "Crois en Moi - Derniere version"
          body: |
            ## Crois en Moi v2.3 - APK Android

            Application catholique : prieres, chapelet guide, chants de messe, calendrier liturgique.

            **Installation :**
            1. Telecharge `crois-en-moi.apk`
            2. Sur ton telephone : Parametres -> Securite -> Autoriser les sources inconnues
            3. Ouvre le fichier telecharge et installe
          artifacts: android/app/build/outputs/apk/debug/crois-en-moi.apk
          token: ${{ secrets.GITHUB_TOKEN }}
