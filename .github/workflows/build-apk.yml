name: Build APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Make gradlew executable (if present)
        run: chmod +x android/gradlew 2>/dev/null || true

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/crois-en-moi.apk

      - name: Create or update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          removeArtifacts: true
          tag: latest
          name: "Crois en Moi — Dernière version"
          body: |
            ## Crois en Moi v2.0 — APK Android

            Application catholique : prières, chapelet guidé, chants de messe, calendrier liturgique.

            **Installation :**
            1. Télécharge `crois-en-moi.apk`
            2. Sur ton téléphone : Paramètres → Sécurité → Autoriser les sources inconnues
            3. Ouvre le fichier téléchargé et installe
          artifacts: android/app/build/outputs/apk/debug/crois-en-moi.apk
          token: ${{ secrets.GITHUB_TOKEN }}
