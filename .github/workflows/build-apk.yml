name: Build APK Android
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Copy index.html to Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          echo "Assets created:"
          ls -la android/app/src/main/assets/
      - name: Install Gradle 8.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.6/bin" >> $GITHUB_PATH
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --info 2>&1 | tail -100
      - name: Debug APK contents
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(stat -c%s $APK) bytes"
          echo "APK contents:"
          unzip -l $APK | head -30
      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/crois-en-moi.apk
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          removeArtifacts: true
          tag: latest
          name: "Crois en Moi - Derniere version"
          artifacts: android/app/build/outputs/apk/debug/crois-en-moi.apk
          token: ${{ secrets.GITHUB_TOKEN }}
