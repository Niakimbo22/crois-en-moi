name: Build APK Android
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Copy index.html to Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
      - name: Install Gradle 8.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.6/bin" >> $GITHUB_PATH
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Check APK size
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ $SIZE -lt 500000 ]; then
            echo "ERROR: APK too small ($SIZE bytes) - build likely failed"
            exit 1
          fi
      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/crois-en-moi.apk
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          removeArtifacts: true
          tag: latest
          name: "Crois en Moi - Derniere version"
          artifacts: android/app/build/outputs/apk/debug/crois-en-moi.apk
          token: ${{ secrets.GITHUB_TOKEN }}
