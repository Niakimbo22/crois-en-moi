name: Build APK Android
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup consistent debug keystore
        run: |
          if [ ! -f android/debug.keystore ]; then
            echo "Generating new debug keystore..."
            keytool -genkeypair -v \
              -keystore android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git add android/debug.keystore
            git commit -m "ci: add consistent debug keystore for stable APK signing"
            git push
          else
            echo "Using existing keystore from repo."
          fi
          mkdir -p ~/.android
          cp android/debug.keystore ~/.android/debug.keystore
      - name: Copy index.html to Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          echo "Assets created:"
          ls -la android/app/src/main/assets/
      - name: Install Gradle 8.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.6/bin" >> $GITHUB_PATH
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --info 2>&1 | tail -100
      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/crois-en-moi.apk
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          removeArtifacts: true
          tag: latest
          name: "Crois en Moi - Derniere version"
          artifacts: android/app/build/outputs/apk/debug/crois-en-moi.apk
          token: ${{ secrets.GITHUB_TOKEN }}
