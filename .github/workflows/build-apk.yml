name: Build APK Android
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Copy index.html to Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/crois-en-moi.apk
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          removeArtifacts: true
          tag: latest
          name: "Crois en Moi - Derniere version"
          artifacts: android/app/build/outputs/apk/debug/crois-en-moi.apk
          token: ${{ secrets.GITHUB_TOKEN }}
